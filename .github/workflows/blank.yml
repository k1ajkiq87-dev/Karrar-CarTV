name: Update Karrar CarTV

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build playlist
        run: |
          python3 - <<'PY'
          import urllib.request
          import re

          sources = [
              ("عراقي", "https://iptv-org.github.io/iptv/countries/iq.m3u", 30),
              ("عربي", "https://iptv-org.github.io/iptv/languages/ara.m3u", 40),
              ("أغاني وموسيقى", "https://iptv-org.github.io/iptv/categories/music.m3u", 30),
              ("أفلام", "https://iptv-org.github.io/iptv/categories/movies.m3u", 25),
              ("أطفال", "https://iptv-org.github.io/iptv/categories/kids.m3u", 20),
              ("وثائقي", "https://iptv-org.github.io/iptv/categories/documentary.m3u", 15),
              ("رياضة", "https://iptv-org.github.io/iptv/categories/sports.m3u", 15),
              ("أخبار", "https://iptv-org.github.io/iptv/categories/news.m3u", 10),
              ("أجنبي", "https://iptv-org.github.io/iptv/languages/eng.m3u", 15),
          ]

          out = ["#EXTM3U"]
          used = set()

          for group, url, limit in sources:
              try:
                  text = urllib.request.urlopen(url, timeout=30).read().decode("utf-8", "ignore")
              except Exception as e:
                  print("FAILED", url, e)
                  continue

              info = None
              count = 0

              for line in text.splitlines():
                  line = line.strip()

                  if line.startswith("#EXTINF:"):
                      info = line
                      continue

                  if info and line.startswith(("http://", "https://")):
                      if line in used:
                          info = None
                          continue

                      used.add(line)

                      if 'group-title="' in info:
                          info = re.sub(
                              r'group-title="[^"]*"',
                              f'group-title="{group}"',
                              info
                          )
                      else:
                          info = info.replace(
                              ",",
                              f' group-title="{group}",',
                              1
                          )

                      out.append(info)
                      out.append(line)

                      count += 1
                      info = None

                      if count >= limit:
                          break

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write("\\n".join(out) + "\\n")

          print("Total channels:", (len(out) - 1) // 2)
          PY

      - name: Save playlist
        run: |
          git config user.name "Karrar-CarTV Bot"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Update CarTV channels"
          git push
