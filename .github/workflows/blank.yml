name: Update Karrar CarTV

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blank.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build clean CarTV playlist
        run: |
          python3 - <<'PY'
          import urllib.request

          sources = [
              ("عراقي", "https://iptv-org.github.io/iptv/countries/iq.m3u", 30),
              ("عربي", "https://iptv-org.github.io/iptv/languages/ara.m3u", 40),
              ("أغاني وموسيقى", "https://iptv-org.github.io/iptv/categories/music.m3u", 30),
              ("أفلام", "https://iptv-org.github.io/iptv/categories/movies.m3u", 25),
              ("أطفال", "https://iptv-org.github.io/iptv/categories/kids.m3u", 20),
              ("وثائقي", "https://iptv-org.github.io/iptv/categories/documentary.m3u", 15),
              ("رياضة", "https://iptv-org.github.io/iptv/categories/sports.m3u", 15),
              ("أخبار", "https://iptv-org.github.io/iptv/categories/news.m3u", 10),
              ("أجنبي", "https://iptv-org.github.io/iptv/languages/eng.m3u", 15),
          ]

          output = ["#EXTM3U"]
          used_urls = set()

          for group, source_url, limit in sources:
              try:
                  req = urllib.request.Request(
                      source_url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  text = urllib.request.urlopen(
                      req,
                      timeout=30
                  ).read().decode("utf-8", "ignore")
              except Exception as e:
                  print("FAILED:", source_url, e)
                  continue

              current_info = None
              count = 0

              for line in text.splitlines():
                  line = line.strip()

                  if line.startswith("#EXTINF:"):
                      current_info = line
                      continue

                  if current_info and line.startswith(("http://", "https://")):
                      if line in used_urls:
                          current_info = None
                          continue

                      used_urls.add(line)

                      if "," in current_info:
                          channel_name = current_info.rsplit(",", 1)[1].strip()
                      else:
                          channel_name = "Channel"

                      channel_name = channel_name.replace('"', "'")

                      output.append(
                          f'#EXTINF:-1 group-title="{group}",{channel_name}'
                      )
                      output.append(line)

                      count += 1
                      current_info = None

                      if count >= limit:
                          break

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print("Total channels:", (len(output) - 1) // 2)
          PY

      - name: Save playlist
        run: |
          git config user.name "Karrar-CarTV Bot"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Update clean CarTV playlist"
          git push
